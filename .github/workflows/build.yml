name: Compilar APK Nativo

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar Capacitor y compilar Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init MiApp com.ejemplo.app --web-dir .
          npx cap add android
          npx cap sync

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como Artefacto (URL de Descarga)
        uses: actions/upload-artifact@v3
        with:
          name: mi-aplicacion-nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
