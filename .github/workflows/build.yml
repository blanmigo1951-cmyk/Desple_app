name: Compilar APK Nativo

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar carpeta web e instalar Capacitor
        run: |
          mkdir -p www
          cp index.html styles.css script.js www/ 2>/dev/null || true
          if [ ! -f www/index.html ]; then
            echo "<!DOCTYPE html><html><head><title>App</title></head><body><h1>App Desplegada</h1></body></html>" > www/index.html
          fi
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init MiApp com.ejemplo.app --web-dir www
          npx cap add android
          npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto (URL de Descarga)
        uses: actions/upload-artifact@v4
        with:
          name: mi-aplicacion-nativa
          path: android/app/build/outputs/apk/debug/app-debug.apk
