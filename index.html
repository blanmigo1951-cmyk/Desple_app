<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desplegador Web Universal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1e293b;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input[type="url"] {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="url"]:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background-color: #0369a1;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .external-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        main {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background-color: #0f172a;
            color: #64748b;
        }
        .placeholder h2 {
            color: #94a3b8;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="title">Desplegador de Aplicaciones</div>
        <div class="input-group">
            <input type="url" id="appUrl" placeholder="https://tu-app.onrender.com" value="https://">
            <button onclick="deployApp()">Desplegar</button>
        </div>
        <div class="actions">
            <span id="statusText">Estado: Esperando URL</span>
            <a href="#" id="openExternal" target="_blank" class="external-link" style="display:none;">Abrir en Navegador ↗</a>
        </div>
    </header>

    <main>
        <div id="placeholder" class="placeholder">
            <h2>Ninguna aplicación cargada</h2>
            <p>Ingresa una dirección web arriba y presiona "Desplegar" para visualizar tu aplicación en tiempo real.</p>
        </div>
        <iframe id="appViewer" style="display:none;" src="" allow="geolocation; microphone; camera; midi; encrypted-media;" sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"></iframe>
    </main>

    <script>
        function deployApp() {
            const urlInput = document.getElementById('appUrl').value.trim();
            const iframe = document.getElementById('appViewer');
            const placeholder = document.getElementById('placeholder');
            const statusText = document.getElementById('statusText');
            const externalLink = document.getElementById('openExternal');

            if (!urlInput || urlInput === 'https://' || urlInput === 'http://') {
                alert('Por favor ingresa una URL válida.');
                return;
            }

            let formattedUrl = urlInput;
            if (!/^https?:\/\//i.test(formattedUrl)) {
                formattedUrl = 'https://' + formattedUrl;
            }

            statusText.textContent = 'Cargando aplicación...';
            placeholder.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = formattedUrl;

            externalLink.href = formattedUrl;
            externalLink.style.display = 'inline';

            iframe.onload = function() {
                statusText.textContent = 'Estado: Desplegado con éxito';
            };
        }
    </script>

</body>
</html>
