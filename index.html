<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desplegador Web Universal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
        .title { font-size: 1.1rem; font-weight: 700; color: #38bdf8; text-align: center; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
        button { padding: 10px 16px; border-radius: 8px; border: none; background-color: #0284c7; color: #fff; font-weight: 600; cursor: pointer; }
        .actions { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .external-link { color: #38bdf8; text-decoration: none; font-weight: 500; }
        main { flex: 1; position: relative; background-color: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; background-color: #0f172a; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <div class="title">Desplegador de Aplicaciones</div>
        <div class="input-group">
            <input type="text" id="appUrl" placeholder="github.com/usuario/repo o https://tu-app.com">
            <button onclick="deployApp()">Desplegar</button>
        </div>
        <div class="actions">
            <span id="statusText">Estado: Listo</span>
            <a href="#" id="openExternal" target="_blank" class="external-link" style="display:none;">Abrir directamente ↗</a>
        </div>
    </header>

    <main>
        <div id="placeholder" class="placeholder">
            <h2>Ingresa una URL limpia</h2>
            <p>Ejemplo: <code>mi-app.onrender.com</code> o <code>github.com</code></p>
        </div>
        <iframe id="appViewer" style="display:none;" src=""></iframe>
    </main>

    <script>
        function deployApp() {
            let rawUrl = document.getElementById('appUrl').value.trim();
            const iframe = document.getElementById('appViewer');
            const placeholder = document.getElementById('placeholder');
            const statusText = document.getElementById('statusText');
            const externalLink = document.getElementById('openExternal');

            if (!rawUrl) {
                alert('Por favor ingresa una URL.');
                return;
            }

            // Elimina prefijos repetidos o mal formateados
            rawUrl = rawUrl.replace(/^(https?:\/\/)+/i, '');
            const finalUrl = 'https://' + rawUrl;

            document.getElementById('appUrl').value = finalUrl;
            statusText.textContent = 'Cargando...';
            placeholder.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = finalUrl;

            externalLink.href = finalUrl;
            externalLink.style.display = 'inline';

            iframe.onload = function() {
                statusText.textContent = 'Estado: Desplegado';
            };
        }
    </script>

</body>
</html>
